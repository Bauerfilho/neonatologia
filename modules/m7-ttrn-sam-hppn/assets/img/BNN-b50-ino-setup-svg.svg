<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="b50-title b50-desc">
  <title id="b50-title">Setup técnico de óxido nítrico inalatório para tratamento de HPPN</title>
  <desc id="b50-desc">Esquema do setup técnico de óxido nítrico inalatório (iNO) para Hipertensão Pulmonar Persistente do Recém-Nascido. Cilindro de NO 800 ppm conectado a misturador blender que regula dose, ventilador neonatal, tubo endotraqueal acoplado ao recém-nascido e sensor de NO e dióxido de nitrogênio monitorando a concentração inspirada. Dose inicial 20 ppm, faixa segura 15-30 ppm, desmame de 5 ppm por vez.</desc>
  <defs>
    <radialGradient id="bg-b50" cx="50%" cy="42%" r="82%">
      <stop offset="0%" stop-color="#142838"/>
      <stop offset="65%" stop-color="#0f1f2c"/>
      <stop offset="100%" stop-color="#0a1620"/>
    </radialGradient>

    <!-- Cilindros de gás: metálico -->
    <linearGradient id="cyl-no-b50" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a5560"/>
      <stop offset="50%" stop-color="#8a95a0"/>
      <stop offset="100%" stop-color="#3a4550"/>
    </linearGradient>
    <linearGradient id="cyl-o2-b50" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4a6a"/>
      <stop offset="50%" stop-color="#3a82b2"/>
      <stop offset="100%" stop-color="#143348"/>
    </linearGradient>
    <linearGradient id="cyl-air-b50" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#404a55"/>
      <stop offset="50%" stop-color="#707a85"/>
      <stop offset="100%" stop-color="#2a333d"/>
    </linearGradient>

    <!-- Blender / display -->
    <linearGradient id="device-b50" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2a36"/>
      <stop offset="100%" stop-color="#0e1822"/>
    </linearGradient>
    <linearGradient id="display-b50" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#062018"/>
      <stop offset="100%" stop-color="#03100c"/>
    </linearGradient>

    <!-- Pele neonato -->
    <linearGradient id="skin-b50" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c0a8"/>
      <stop offset="100%" stop-color="#b08868"/>
    </linearGradient>

    <marker id="flow-arrow-b50" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6b5a"/>
    </marker>
    <marker id="flow-arrow-info-b50" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6cb4e8"/>
    </marker>
  </defs>

  <rect width="720" height="480" fill="url(#bg-b50)"/>

  <!-- Tag-topo -->
  <g transform="translate(20,14)">
    <rect width="680" height="34" rx="10" fill="rgba(108,180,232,0.16)" stroke="rgba(108,180,232,0.50)" stroke-width="1.2"/>
    <circle cx="20" cy="17" r="5" fill="#6cb4e8"/>
    <text x="36" y="22" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#f3ede0" letter-spacing="0.6">ÓXIDO NÍTRICO INALATÓRIO (iNO) · HPPN · SETUP TÉCNICO</text>
  </g>

  <!-- ================== CILINDROS DE GÁS (esquerda) ================== -->

  <!-- Cilindro NO (principal) -->
  <g transform="translate(36,80)">
    <!-- Corpo -->
    <rect x="0" y="20" width="60" height="140" rx="6" fill="url(#cyl-no-b50)" stroke="#2a3540" stroke-width="0.8"/>
    <!-- Ombro/topo -->
    <ellipse cx="30" cy="20" rx="30" ry="8" fill="#8a95a0" stroke="#2a3540" stroke-width="0.6"/>
    <!-- Válvula -->
    <rect x="22" y="4" width="16" height="14" rx="2" fill="#2a3540"/>
    <rect x="20" y="0" width="20" height="6" rx="1" fill="#4a5560"/>
    <!-- Manômetro pequeno -->
    <circle cx="48" cy="14" r="6" fill="#0e1822" stroke="#4a5560" stroke-width="0.6"/>
    <circle cx="48" cy="14" r="1" fill="#5fcf80"/>
    <!-- Etiqueta -->
    <rect x="6" y="60" width="48" height="34" rx="3" fill="rgba(255,107,90,0.18)" stroke="rgba(255,107,90,0.55)" stroke-width="0.8"/>
    <text x="30" y="74" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="10" font-weight="800" fill="#ff8a7a">NO</text>
    <text x="30" y="87" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="9" font-weight="600" fill="#f3ede0">800 ppm</text>
    <!-- Label -->
    <text x="30" y="178" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="#ff8a7a">Cilindro NO</text>
  </g>

  <!-- Cilindro O2 (auxiliar, pequeno) -->
  <g transform="translate(36,236)">
    <rect x="0" y="14" width="42" height="84" rx="5" fill="url(#cyl-o2-b50)" stroke="#143348" stroke-width="0.8"/>
    <ellipse cx="21" cy="14" rx="21" ry="6" fill="#3a82b2" stroke="#143348" stroke-width="0.5"/>
    <rect x="15" y="2" width="12" height="10" rx="1.5" fill="#143348"/>
    <text x="21" y="56" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="11" font-weight="800" fill="#f3ede0">O₂</text>
    <text x="21" y="116" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="9" font-weight="500" fill="#6cb4e8">Oxigênio</text>
  </g>

  <!-- Cilindro Ar comprimido (auxiliar) -->
  <g transform="translate(94,236)">
    <rect x="0" y="14" width="42" height="84" rx="5" fill="url(#cyl-air-b50)" stroke="#2a333d" stroke-width="0.8"/>
    <ellipse cx="21" cy="14" rx="21" ry="6" fill="#707a85" stroke="#2a333d" stroke-width="0.5"/>
    <rect x="15" y="2" width="12" height="10" rx="1.5" fill="#2a333d"/>
    <text x="21" y="56" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="10" font-weight="800" fill="#f3ede0">AR</text>
    <text x="21" y="116" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="9" font-weight="500" fill="#c3bcae">Comp.</text>
  </g>

  <!-- ================== BLENDER (centro-esquerda) ================== -->

  <g transform="translate(190,114)">
    <rect width="140" height="120" rx="10" fill="url(#device-b50)" stroke="rgba(243,237,224,0.18)" stroke-width="1"/>
    <!-- Top bar -->
    <rect x="10" y="10" width="120" height="16" rx="4" fill="rgba(243,237,224,0.06)"/>
    <text x="70" y="22" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#c3bcae" letter-spacing="0.6">BLENDER iNO</text>

    <!-- Display verde-LCD -->
    <rect x="14" y="34" width="112" height="44" rx="4" fill="url(#display-b50)" stroke="#143b30" stroke-width="0.8"/>
    <text x="70" y="56" text-anchor="middle" font-family="SF Mono,JetBrains Mono,Menlo,monospace" font-size="22" font-weight="700" fill="#5fcf80" letter-spacing="1">20</text>
    <text x="70" y="72" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="9" font-weight="600" fill="#5fcf80">ppm</text>

    <!-- Knobs/controles -->
    <circle cx="28" cy="96" r="9" fill="#0e1822" stroke="#4a5560" stroke-width="1"/>
    <circle cx="28" cy="96" r="2" fill="#ff6b5a"/>
    <text x="28" y="114" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="7" font-weight="500" fill="#c3bcae">DOSE</text>

    <circle cx="70" cy="96" r="9" fill="#0e1822" stroke="#4a5560" stroke-width="1"/>
    <circle cx="70" cy="96" r="2" fill="#6cb4e8"/>
    <text x="70" y="114" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="7" font-weight="500" fill="#c3bcae">FLUXO</text>

    <circle cx="112" cy="96" r="9" fill="#0e1822" stroke="#4a5560" stroke-width="1"/>
    <circle cx="112" cy="96" r="2" fill="#f0b440"/>
    <text x="112" y="114" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="7" font-weight="500" fill="#c3bcae">ALARM</text>
  </g>

  <!-- ================== VENTILADOR NEONATAL (centro-direita superior) ================== -->

  <g transform="translate(372,82)">
    <rect width="140" height="156" rx="10" fill="url(#device-b50)" stroke="rgba(243,237,224,0.18)" stroke-width="1"/>
    <!-- Top bar -->
    <rect x="10" y="10" width="120" height="16" rx="4" fill="rgba(243,237,224,0.06)"/>
    <text x="70" y="22" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="9" font-weight="700" fill="#c3bcae" letter-spacing="0.6">VENTILADOR NEONATAL</text>

    <!-- Tela com curvas -->
    <rect x="14" y="34" width="112" height="74" rx="4" fill="#03101a" stroke="#143348" stroke-width="0.8"/>
    <!-- Grade leve -->
    <g stroke="rgba(108,180,232,0.10)" stroke-width="0.5">
      <line x1="14" y1="52" x2="126" y2="52"/>
      <line x1="14" y1="70" x2="126" y2="70"/>
      <line x1="14" y1="90" x2="126" y2="90"/>
      <line x1="40" y1="34" x2="40" y2="108"/>
      <line x1="70" y1="34" x2="70" y2="108"/>
      <line x1="100" y1="34" x2="100" y2="108"/>
    </g>
    <!-- Curva pressão -->
    <path d="M 18 50 L 28 40 L 42 40 L 52 50 L 70 50 L 80 40 L 94 40 L 104 50 L 122 50"
          fill="none" stroke="#6cb4e8" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- Curva fluxo -->
    <path d="M 18 76 L 26 64 L 36 76 L 42 84 L 52 76 L 70 76 L 78 64 L 88 76 L 94 84 L 104 76 L 122 76"
          fill="none" stroke="#5fcf80" stroke-width="1.2"/>
    <!-- Curva volume -->
    <path d="M 18 100 Q 28 92, 42 92 Q 52 92, 60 100 Q 70 100, 80 92 Q 94 92, 104 100 L 122 100"
          fill="none" stroke="#f0b440" stroke-width="1.2"/>

    <!-- Linha de parâmetros -->
    <rect x="14" y="114" width="112" height="32" rx="3" fill="rgba(243,237,224,0.04)"/>
    <text x="22" y="126" font-family="SF Mono,monospace" font-size="8" font-weight="700" fill="#6cb4e8">PIP</text>
    <text x="22" y="138" font-family="SF Mono,monospace" font-size="9" font-weight="700" fill="#f3ede0">22</text>
    <text x="56" y="126" font-family="SF Mono,monospace" font-size="8" font-weight="700" fill="#5fcf80">FR</text>
    <text x="56" y="138" font-family="SF Mono,monospace" font-size="9" font-weight="700" fill="#f3ede0">40</text>
    <text x="86" y="126" font-family="SF Mono,monospace" font-size="8" font-weight="700" fill="#f0b440">FiO₂</text>
    <text x="86" y="138" font-family="SF Mono,monospace" font-size="9" font-weight="700" fill="#f3ede0">60%</text>
  </g>

  <!-- ================== SENSOR NO/NO2 (acima do tubo, à direita do blender) ================== -->

  <g transform="translate(338,254)">
    <rect width="72" height="44" rx="6" fill="url(#device-b50)" stroke="rgba(240,180,64,0.45)" stroke-width="1.1"/>
    <rect x="6" y="6" width="60" height="14" rx="2" fill="rgba(240,180,64,0.16)"/>
    <text x="36" y="16" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="8" font-weight="700" fill="#f0b440">SENSOR NO/NO₂</text>
    <text x="14" y="34" font-family="SF Mono,monospace" font-size="8.5" font-weight="700" fill="#5fcf80">NO 20</text>
    <text x="44" y="34" font-family="SF Mono,monospace" font-size="8.5" font-weight="700" fill="#f0b440">NO₂ 0.4</text>
  </g>

  <!-- ================== TUBO ENDOTRAQUEAL + RN (parte inferior direita) ================== -->

  <g transform="translate(420,322)">
    <!-- Berço/leito -->
    <rect x="-26" y="60" width="280" height="38" rx="6" fill="#1a2530" stroke="rgba(243,237,224,0.14)" stroke-width="0.8"/>
    <rect x="-18" y="64" width="264" height="22" rx="4" fill="rgba(243,237,224,0.06)"/>

    <!-- Cabeça neonato -->
    <ellipse cx="40" cy="48" rx="28" ry="32" fill="url(#skin-b50)" stroke="#7a5840" stroke-width="0.8"/>
    <!-- Olho fechado -->
    <path d="M 30 44 Q 36 47, 42 44" stroke="#5a3830" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <!-- Boca aberta com tubo -->
    <ellipse cx="38" cy="60" rx="6" ry="3" fill="#3a1818"/>
    <!-- Narinas -->
    <circle cx="34" cy="54" r="1" fill="#5a3830"/>
    <circle cx="42" cy="54" r="1" fill="#5a3830"/>
    <!-- Tronco -->
    <path d="M 64 36 Q 220 30, 240 50 Q 244 70, 220 78 Q 80 76, 64 70 z"
          fill="url(#skin-b50)" stroke="#7a5840" stroke-width="0.8"/>

    <!-- Tubo endotraqueal -->
    <path d="M 38 60 Q 42 74, 60 78" fill="none" stroke="#f3ede0" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 60 78 Q 100 84, 140 88" fill="none" stroke="#f3ede0" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Fixador do tubo na boca -->
    <rect x="44" y="56" width="6" height="10" rx="1" fill="#f0b440" opacity="0.85"/>
    <!-- Conector -->
    <rect x="138" y="84" width="14" height="10" rx="1.5" fill="#4a5560" stroke="#2a3540" stroke-width="0.5"/>

    <!-- Label TOT -->
    <text x="100" y="100" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="9" font-weight="600" fill="#c3bcae">tubo endotraqueal</text>

    <!-- Label RN -->
    <text x="40" y="110" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#ff8a7a">RN · HPPN</text>
  </g>

  <!-- ================== FLUXOGRAMA DE CONEXÕES ================== -->

  <!-- NO cilindro → blender -->
  <path d="M 96 152 Q 130 152, 188 174" fill="none" stroke="#ff6b5a" stroke-width="2.2" stroke-linecap="round" marker-end="url(#flow-arrow-b50)"/>
  <text x="130" y="146" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="8.5" font-weight="600" fill="#ff8a7a">NO 800 ppm</text>

  <!-- O2 + Ar → blender (auxiliares) -->
  <path d="M 78 252 Q 130 244, 188 224" fill="none" stroke="#6cb4e8" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3,3" marker-end="url(#flow-arrow-info-b50)"/>
  <path d="M 136 252 Q 162 240, 188 234" fill="none" stroke="#6cb4e8" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3,3" marker-end="url(#flow-arrow-info-b50)"/>

  <!-- Blender → ventilador -->
  <path d="M 330 168 L 370 168" fill="none" stroke="#ff6b5a" stroke-width="2.2" stroke-linecap="round" marker-end="url(#flow-arrow-b50)"/>
  <text x="350" y="162" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="8.5" font-weight="600" fill="#ff8a7a">20 ppm</text>

  <!-- Ventilador → tubo (linha inspiratória) → RN -->
  <path d="M 442 240 L 442 268 Q 442 296, 470 322" fill="none" stroke="#ff6b5a" stroke-width="2.2" stroke-linecap="round" marker-end="url(#flow-arrow-b50)"/>
  <text x="448" y="290" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="8.5" font-weight="600" fill="#ff8a7a">linha inspiratória</text>

  <!-- Sensor lê do circuito (linha pontilhada de medição) -->
  <path d="M 410 276 L 442 276" fill="none" stroke="#f0b440" stroke-width="1.4" stroke-dasharray="2,2"/>
  <text x="410" y="270" text-anchor="end" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="8" font-weight="500" fill="#f0b440">amostra NO/NO₂</text>

  <!-- ================== BOXES PARÂMETROS CLÍNICOS (parte inferior esquerda) ================== -->

  <g transform="translate(20,402)">
    <rect width="170" height="60" rx="8" fill="rgba(95,207,128,0.10)" stroke="rgba(95,207,128,0.45)" stroke-width="1"/>
    <text x="12" y="18" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#5fcf80">DOSE INICIAL</text>
    <text x="12" y="38" font-family="SF Mono,monospace" font-size="18" font-weight="800" fill="#f3ede0">20 ppm</text>
    <text x="12" y="54" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="9.5" font-weight="500" fill="#c3bcae">Padrão internacional</text>
  </g>

  <g transform="translate(200,402)">
    <rect width="170" height="60" rx="8" fill="rgba(108,180,232,0.10)" stroke="rgba(108,180,232,0.45)" stroke-width="1"/>
    <text x="12" y="18" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#6cb4e8">FAIXA SEGURA</text>
    <text x="12" y="38" font-family="SF Mono,monospace" font-size="18" font-weight="800" fill="#f3ede0">15-30 ppm</text>
    <text x="12" y="54" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="9.5" font-weight="500" fill="#c3bcae">Sem ganho acima de 30</text>
  </g>

  <g transform="translate(380,402)">
    <rect width="170" height="60" rx="8" fill="rgba(240,180,64,0.10)" stroke="rgba(240,180,64,0.45)" stroke-width="1"/>
    <text x="12" y="18" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#f0b440">DESMAME</text>
    <text x="12" y="38" font-family="SF Mono,monospace" font-size="18" font-weight="800" fill="#f3ede0">5 ppm/vez</text>
    <text x="12" y="54" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="9.5" font-weight="500" fill="#c3bcae">Conforme SpO₂ e PaO₂</text>
  </g>

  <g transform="translate(560,402)">
    <rect width="140" height="60" rx="8" fill="rgba(255,107,90,0.10)" stroke="rgba(255,107,90,0.45)" stroke-width="1"/>
    <text x="12" y="18" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="10" font-weight="700" fill="#ff8a7a">MONITOR</text>
    <text x="12" y="38" font-family="SF Mono,monospace" font-size="14" font-weight="800" fill="#f3ede0">NO + NO₂</text>
    <text x="12" y="54" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="9.5" font-weight="500" fill="#c3bcae">+ metahemoglobina</text>
  </g>
</svg>
