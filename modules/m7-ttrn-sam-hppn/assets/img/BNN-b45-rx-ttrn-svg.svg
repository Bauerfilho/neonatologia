<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="b45-title b45-desc">
  <title id="b45-title">Radiografia esquemática de TTRN com líquido em cisura interlobar</title>
  <desc id="b45-desc">Esquema de radiografia de tórax em recém-nascido com Taquipneia Transitória do RN mostrando líquido na cisura interlobar direita como sinal patognomônico, trama vascular pulmonar aumentada e hiperinsuflação leve. Silhueta cardíaca normal com índice cardiotorácico inferior a 0,6.</desc>
  <defs>
    <radialGradient id="bg-b45" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#142838"/>
      <stop offset="60%" stop-color="#0f1f2c"/>
      <stop offset="100%" stop-color="#0a1620"/>
    </radialGradient>
    <linearGradient id="rx-panel-b45" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2530"/>
      <stop offset="100%" stop-color="#0e1822"/>
    </linearGradient>
    <radialGradient id="lung-r-b45" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="rgba(108,180,232,0.12)"/>
      <stop offset="70%" stop-color="rgba(108,180,232,0.05)"/>
      <stop offset="100%" stop-color="rgba(10,22,32,0)"/>
    </radialGradient>
    <radialGradient id="lung-l-b45" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="rgba(108,180,232,0.12)"/>
      <stop offset="70%" stop-color="rgba(108,180,232,0.05)"/>
      <stop offset="100%" stop-color="rgba(10,22,32,0)"/>
    </radialGradient>
    <linearGradient id="heart-b45" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a6470"/>
      <stop offset="100%" stop-color="#363f49"/>
    </linearGradient>
    <linearGradient id="diaphragm-b45" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#454f5a"/>
      <stop offset="100%" stop-color="#2a323b"/>
    </linearGradient>
    <linearGradient id="fissure-fluid-b45" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(240,180,64,0)"/>
      <stop offset="30%" stop-color="rgba(240,180,64,0.85)"/>
      <stop offset="70%" stop-color="rgba(255,107,90,0.95)"/>
      <stop offset="100%" stop-color="rgba(255,107,90,0)"/>
    </linearGradient>
    <marker id="arrow-coral-b45" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6b5a"/>
    </marker>
    <marker id="arrow-amber-b45" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f0b440"/>
    </marker>
    <marker id="arrow-info-b45" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6cb4e8"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="url(#bg-b45)"/>

  <!-- Tag-topo verde-info: identificação do esquema -->
  <g transform="translate(20,16)">
    <rect width="560" height="34" rx="10" fill="rgba(108,180,232,0.14)" stroke="rgba(108,180,232,0.40)" stroke-width="1"/>
    <circle cx="20" cy="17" r="5" fill="#6cb4e8"/>
    <text x="36" y="22" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#f3ede0" letter-spacing="0.5">RX TÓRAX · TAQUIPNEIA TRANSITÓRIA DO RN · ACHADOS CLÁSSICOS</text>
  </g>

  <!-- Painel radiográfico -->
  <g transform="translate(140,70)">
    <rect width="320" height="330" rx="6" fill="url(#rx-panel-b45)" stroke="rgba(243,237,224,0.18)" stroke-width="1.2"/>

    <!-- Caixa torácica: contornos costais e clavículas -->
    <g stroke="rgba(195,188,174,0.42)" stroke-width="1" fill="none" stroke-linecap="round">
      <!-- Clavículas -->
      <path d="M 40 38 Q 90 28, 158 42"/>
      <path d="M 280 38 Q 230 28, 162 42"/>
      <!-- Coluna sugerida -->
      <line x1="160" y1="38" x2="160" y2="290" stroke="rgba(195,188,174,0.18)" stroke-dasharray="2,4"/>
      <!-- Arcos costais direitos (lado esquerdo da imagem) -->
      <path d="M 36 70 Q 96 56, 156 72"/>
      <path d="M 30 100 Q 92 86, 156 102"/>
      <path d="M 26 132 Q 90 118, 156 134"/>
      <path d="M 24 164 Q 90 152, 156 168"/>
      <path d="M 26 198 Q 92 188, 156 204"/>
      <path d="M 30 232 Q 96 224, 156 240"/>
      <path d="M 38 264 Q 100 258, 156 272"/>
      <!-- Arcos costais esquerdos (lado direito da imagem) -->
      <path d="M 284 70 Q 224 56, 164 72"/>
      <path d="M 290 100 Q 228 86, 164 102"/>
      <path d="M 294 132 Q 230 118, 164 134"/>
      <path d="M 296 164 Q 230 152, 164 168"/>
      <path d="M 294 198 Q 228 188, 164 204"/>
      <path d="M 290 232 Q 224 224, 164 240"/>
      <path d="M 282 264 Q 220 258, 164 272"/>
    </g>

    <!-- Pulmões com hiperinsuflação leve (translúcidos) -->
    <ellipse cx="84" cy="160" rx="56" ry="110" fill="url(#lung-r-b45)"/>
    <ellipse cx="236" cy="160" rx="56" ry="110" fill="url(#lung-l-b45)"/>

    <!-- Trama vascular AUMENTADA - direita -->
    <g stroke="#6cb4e8" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.82">
      <path d="M 150 130 Q 130 140, 110 150"/>
      <path d="M 150 130 Q 124 138, 100 132"/>
      <path d="M 150 130 Q 122 150, 92 168"/>
      <path d="M 150 130 Q 112 162, 78 196"/>
      <path d="M 150 130 Q 130 170, 116 210"/>
      <path d="M 150 130 Q 132 158, 124 188"/>
      <path d="M 150 130 Q 110 142, 76 132"/>
      <path d="M 150 130 Q 96 152, 64 156"/>
    </g>
    <!-- Trama vascular AUMENTADA - esquerda -->
    <g stroke="#6cb4e8" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.82">
      <path d="M 170 130 Q 190 140, 210 150"/>
      <path d="M 170 130 Q 196 138, 220 132"/>
      <path d="M 170 130 Q 198 150, 228 168"/>
      <path d="M 170 130 Q 208 162, 242 196"/>
      <path d="M 170 130 Q 190 170, 204 210"/>
      <path d="M 170 130 Q 188 158, 196 188"/>
      <path d="M 170 130 Q 210 142, 244 132"/>
      <path d="M 170 130 Q 224 152, 256 156"/>
    </g>

    <!-- Silhueta cardíaca centrada, ICT < 0.6 -->
    <path d="M 160 130 Q 196 140, 208 184 Q 212 232, 184 256 Q 160 268, 136 256 Q 108 232, 112 184 Q 124 140, 160 130 z"
          fill="url(#heart-b45)" stroke="rgba(243,237,224,0.30)" stroke-width="1"/>

    <!-- Mediastino: traqueia + aorta sugerida -->
    <path d="M 156 38 L 156 130" stroke="rgba(243,237,224,0.40)" stroke-width="2" fill="none"/>
    <path d="M 164 38 L 164 130" stroke="rgba(243,237,224,0.40)" stroke-width="2" fill="none"/>

    <!-- LÍQUIDO NA CISURA INTERLOBAR DIREITA (sinal patognomônico) -->
    <!-- Cisura horizontal D - linha do 4º arco costal seguindo até hilo -->
    <path d="M 40 142 Q 90 144, 134 146"
          stroke="url(#fissure-fluid-b45)" stroke-width="4.2" fill="none" stroke-linecap="round"/>
    <!-- Reforço de espessura sugerindo líquido -->
    <path d="M 50 142 Q 90 144, 130 146"
          stroke="rgba(255,107,90,0.55)" stroke-width="2.2" fill="none" stroke-linecap="round"/>

    <!-- Diafragma rebaixado (hiperinsuflação leve): em torno de 9-10º arco -->
    <path d="M 36 282 Q 80 296, 156 290 Q 224 296, 284 282 L 284 296 Q 160 314, 36 296 z"
          fill="url(#diaphragm-b45)" stroke="rgba(243,237,224,0.25)" stroke-width="1"/>
  </g>

  <!-- Anotação principal: líquido na cisura (patognomônico) -->
  <g transform="translate(20,150)">
    <rect width="118" height="62" rx="8" fill="rgba(255,107,90,0.14)" stroke="rgba(255,107,90,0.55)" stroke-width="1.2"/>
    <text x="10" y="20" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#ff8a7a">PATOGNOMÔNICO</text>
    <text x="10" y="38" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#f3ede0">Líquido na cisura</text>
    <text x="10" y="52" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="11" font-weight="500" fill="#e7e0d0">interlobar direita</text>
  </g>
  <!-- Seta da anotação patognomônica até a cisura -->
  <path d="M 140 188 Q 168 200, 210 215" stroke="#ff6b5a" stroke-width="1.8" fill="none" marker-end="url(#arrow-coral-b45)"/>

  <!-- Anotação: trama vascular aumentada -->
  <g transform="translate(460,90)">
    <rect width="120" height="48" rx="8" fill="rgba(108,180,232,0.14)" stroke="rgba(108,180,232,0.40)" stroke-width="1"/>
    <text x="10" y="20" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#6cb4e8">Trama vascular</text>
    <text x="10" y="36" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="11" font-weight="500" fill="#e7e0d0">aumentada</text>
  </g>
  <path d="M 458 116 Q 432 138, 408 162" stroke="#6cb4e8" stroke-width="1.6" fill="none" marker-end="url(#arrow-info-b45)"/>

  <!-- Anotação: hiperinsuflação leve -->
  <g transform="translate(460,330)">
    <rect width="120" height="48" rx="8" fill="rgba(240,180,64,0.14)" stroke="rgba(240,180,64,0.40)" stroke-width="1"/>
    <text x="10" y="20" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#f0b440">Hiperinsuflação</text>
    <text x="10" y="36" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="11" font-weight="500" fill="#e7e0d0">leve · diafragma 9-10</text>
  </g>
  <path d="M 458 358 Q 432 358, 408 360" stroke="#f0b440" stroke-width="1.6" fill="none" marker-end="url(#arrow-amber-b45)"/>

  <!-- Anotação: silhueta cardíaca normal -->
  <g transform="translate(20,330)">
    <rect width="118" height="48" rx="8" fill="rgba(95,207,128,0.14)" stroke="rgba(95,207,128,0.40)" stroke-width="1"/>
    <text x="10" y="20" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#5fcf80">ICT &lt; 0,6</text>
    <text x="10" y="36" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="11" font-weight="500" fill="#e7e0d0">silhueta normal</text>
  </g>
  <path d="M 140 354 Q 200 348, 268 326" stroke="#5fcf80" stroke-width="1.6" fill="none" marker-end="url(#arrow-info-b45)"/>

  <!-- Rodapé técnico -->
  <g transform="translate(20,420)">
    <rect width="560" height="46" rx="10" fill="rgba(243,237,224,0.05)" stroke="rgba(243,237,224,0.10)" stroke-width="1"/>
    <text x="14" y="20" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#f3ede0">PA · neonato termo · padrão TTRN</text>
    <text x="14" y="36" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="11" font-weight="500" fill="#c3bcae">Reabsorção lenta de líquido pulmonar fetal · resolve em 24-72 h</text>
  </g>
</svg>
