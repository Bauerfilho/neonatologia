<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="v57-title v57-desc">
  <title id="v57-title">Recém-nascido com impregnação meconial cutânea, unha e coto umbilical</title>
  <desc id="v57-desc">Silhueta corporal estilizada de recém-nascido a termo, sem face (anonimização total), evidenciando impregnação meconial: pele tinta de tonalidade marrom-esverdeada em manchas distribuídas no tronco e membros. Dois insets ampliados mostram a unha alaranjada-amarronzada (impregnação ungueal por exposição intrauterina prolongada) e o coto umbilical com coloração marrom-esverdeada. Achados sinalizados com setas e labels técnicos.</desc>
  <defs>
    <radialGradient id="v57-bg" cx="50%" cy="42%" r="85%">
      <stop offset="0%" stop-color="#142838"/>
      <stop offset="60%" stop-color="#0f1f2c"/>
      <stop offset="100%" stop-color="#0a1620"/>
    </radialGradient>
    <linearGradient id="v57-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9b78a"/>
      <stop offset="100%" stop-color="#b6905f"/>
    </linearGradient>
    <radialGradient id="v57-mec" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#6b5d3a"/>
      <stop offset="100%" stop-color="rgba(107,93,58,0)"/>
    </radialGradient>
    <linearGradient id="v57-nail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d68a4a"/>
      <stop offset="100%" stop-color="#8a5a30"/>
    </linearGradient>
    <linearGradient id="v57-cord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#85724a"/>
      <stop offset="100%" stop-color="#4f4226"/>
    </linearGradient>
    <marker id="v57-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6b5a"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="url(#v57-bg)"/>

  <!-- Silhueta corporal RN (SEM FACE) -->
  <g transform="translate(240, 60)">
    <!-- Cabeça (oval simples, sem rosto) -->
    <ellipse cx="160" cy="60" rx="58" ry="62" fill="url(#v57-skin)" stroke="rgba(243,237,224,0.20)" stroke-width="1"/>
    <!-- Pescoço -->
    <rect x="138" y="110" width="44" height="22" fill="url(#v57-skin)"/>
    <!-- Tronco -->
    <path d="M 100 130 Q 90 200, 100 290 Q 110 360, 130 400 L 190 400 Q 210 360, 220 290 Q 230 200, 220 130 Z"
          fill="url(#v57-skin)" stroke="rgba(243,237,224,0.22)" stroke-width="1.2"/>
    <!-- Braço esquerdo (na imagem) -->
    <path d="M 100 145 Q 60 200, 50 260 Q 48 305, 58 335 L 80 335 Q 80 295, 88 250 Q 95 200, 110 168 Z"
          fill="url(#v57-skin)" stroke="rgba(243,237,224,0.22)" stroke-width="1.2"/>
    <!-- Braço direito -->
    <path d="M 220 145 Q 260 200, 270 260 Q 272 305, 262 335 L 240 335 Q 240 295, 232 250 Q 225 200, 210 168 Z"
          fill="url(#v57-skin)" stroke="rgba(243,237,224,0.22)" stroke-width="1.2"/>
    <!-- Mão esquerda -->
    <ellipse cx="69" cy="350" rx="22" ry="18" fill="url(#v57-skin)" stroke="rgba(243,237,224,0.22)" stroke-width="1.2"/>
    <!-- Mão direita -->
    <ellipse cx="251" cy="350" rx="22" ry="18" fill="url(#v57-skin)" stroke="rgba(243,237,224,0.22)" stroke-width="1.2"/>
    <!-- Pernas -->
    <path d="M 130 400 Q 122 450, 124 500 L 156 500 Q 162 450, 158 400 Z"
          fill="url(#v57-skin)" stroke="rgba(243,237,224,0.22)" stroke-width="1.2"/>
    <path d="M 190 400 Q 198 450, 196 500 L 164 500 Q 158 450, 162 400 Z"
          fill="url(#v57-skin)" stroke="rgba(243,237,224,0.22)" stroke-width="1.2"/>
    <!-- Pés -->
    <ellipse cx="140" cy="510" rx="20" ry="14" fill="url(#v57-skin)" stroke="rgba(243,237,224,0.22)" stroke-width="1.2"/>
    <ellipse cx="180" cy="510" rx="20" ry="14" fill="url(#v57-skin)" stroke="rgba(243,237,224,0.22)" stroke-width="1.2"/>

    <!-- Manchas de mecônio (tronco) -->
    <g opacity="0.85">
      <ellipse cx="135" cy="175" rx="22" ry="14" fill="#6b5d3a"/>
      <ellipse cx="185" cy="195" rx="18" ry="10" fill="#6b5d3a"/>
      <ellipse cx="155" cy="220" rx="26" ry="16" fill="#6b5d3a"/>
      <ellipse cx="200" cy="245" rx="14" ry="9" fill="#6b5d3a"/>
      <ellipse cx="125" cy="265" rx="18" ry="11" fill="#6b5d3a"/>
      <ellipse cx="175" cy="295" rx="22" ry="13" fill="#6b5d3a"/>
      <ellipse cx="195" cy="330" rx="15" ry="9" fill="#6b5d3a"/>
      <ellipse cx="140" cy="345" rx="18" ry="10" fill="#6b5d3a"/>
      <!-- Manchas membros -->
      <ellipse cx="75" cy="240" rx="14" ry="9" fill="#6b5d3a"/>
      <ellipse cx="68" cy="295" rx="12" ry="8" fill="#6b5d3a"/>
      <ellipse cx="248" cy="225" rx="13" ry="9" fill="#6b5d3a"/>
      <ellipse cx="252" cy="290" rx="14" ry="9" fill="#6b5d3a"/>
      <ellipse cx="138" cy="440" rx="14" ry="9" fill="#6b5d3a"/>
      <ellipse cx="182" cy="455" rx="13" ry="9" fill="#6b5d3a"/>
      <!-- Halos difusos -->
      <ellipse cx="160" cy="240" rx="55" ry="50" fill="url(#v57-mec)" opacity="0.45"/>
      <ellipse cx="158" cy="320" rx="50" ry="40" fill="url(#v57-mec)" opacity="0.40"/>
    </g>

    <!-- Coto umbilical (centro abdome, marrom-esverdeado) -->
    <ellipse cx="162" cy="280" rx="14" ry="20" fill="url(#v57-cord)" stroke="rgba(243,237,224,0.30)" stroke-width="1"/>
    <ellipse cx="162" cy="280" rx="5" ry="8" fill="#3a3220"/>

    <!-- Indicador de inset coto -->
    <circle cx="162" cy="280" r="22" fill="none" stroke="#ff6b5a" stroke-width="1.4" stroke-dasharray="3,3"/>

    <!-- Indicador de inset unha (mão direita) -->
    <circle cx="251" cy="350" r="20" fill="none" stroke="#ff6b5a" stroke-width="1.4" stroke-dasharray="3,3"/>
  </g>

  <!-- ============ INSET 1: UNHA (canto superior direito) ============ -->
  <g transform="translate(600, 70)">
    <rect x="0" y="0" width="180" height="170" rx="12" fill="rgba(14,24,32,0.92)" stroke="rgba(243,237,224,0.18)" stroke-width="1"/>
    <text x="90" y="22" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#c3bcae" text-anchor="middle">Inset · unha</text>

    <!-- Dedo ampliado -->
    <g transform="translate(35, 36)">
      <!-- falange/polpa digital -->
      <path d="M 20 110 Q 18 60, 35 30 Q 55 8, 75 12 Q 95 16, 105 50 Q 110 90, 100 120 Z"
            fill="url(#v57-skin)" stroke="rgba(243,237,224,0.30)" stroke-width="1.2"/>
      <!-- leito ungueal -->
      <path d="M 38 32 Q 55 18, 80 24 Q 92 28, 95 50 Q 90 65, 70 68 Q 48 65, 40 55 Z"
            fill="url(#v57-nail)" stroke="rgba(243,237,224,0.40)" stroke-width="1"/>
      <!-- lúnula tingida -->
      <path d="M 50 38 Q 65 32, 82 38 Q 85 46, 70 48 Q 55 46, 50 42 Z" fill="#b67338" opacity="0.85"/>
    </g>

    <text x="90" y="158" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#ff6b5a" text-anchor="middle">unha alaranjada</text>
  </g>

  <!-- ============ INSET 2: COTO UMBILICAL (canto inferior direito) ============ -->
  <g transform="translate(600, 380)">
    <rect x="0" y="0" width="180" height="180" rx="12" fill="rgba(14,24,32,0.92)" stroke="rgba(243,237,224,0.18)" stroke-width="1"/>
    <text x="90" y="22" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#c3bcae" text-anchor="middle">Inset · coto umbilical</text>

    <!-- pele de fundo -->
    <ellipse cx="90" cy="100" rx="65" ry="48" fill="url(#v57-skin)" stroke="rgba(243,237,224,0.20)" stroke-width="1"/>
    <!-- halo de mecônio na pele periumbilical -->
    <ellipse cx="90" cy="100" rx="40" ry="32" fill="#6b5d3a" opacity="0.55"/>
    <!-- coto -->
    <ellipse cx="90" cy="100" rx="20" ry="32" fill="url(#v57-cord)" stroke="rgba(243,237,224,0.40)" stroke-width="1.2"/>
    <!-- vasos do cordão (resíduo) -->
    <circle cx="86" cy="92" r="3" fill="#2d2517"/>
    <circle cx="94" cy="100" r="3" fill="#2d2517"/>
    <circle cx="86" cy="112" r="3" fill="#2d2517"/>
    <!-- textura -->
    <path d="M 78 78 Q 82 100, 78 122 M 102 80 Q 98 100, 102 120" stroke="rgba(0,0,0,0.25)" stroke-width="0.8" fill="none"/>

    <text x="90" y="168" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#ff6b5a" text-anchor="middle">coto tinto</text>
  </g>

  <!-- Setas conectando insets aos pontos no corpo + label pele tinta -->
  <line x1="595" y1="155" x2="500" y2="410" stroke="rgba(255,107,90,0.55)" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="595" y1="465" x2="402" y2="340" stroke="rgba(255,107,90,0.55)" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- Label "pele tinta" -->
  <line x1="60" y1="280" x2="335" y2="280" stroke="#ff6b5a" stroke-width="1.8" marker-end="url(#v57-arrow)"/>
  <g transform="translate(40, 254)">
    <rect x="0" y="0" width="180" height="46" rx="8" fill="rgba(255,107,90,0.14)" stroke="rgba(255,107,90,0.55)" stroke-width="1"/>
    <text x="14" y="20" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ff6b5a">Pele tinta</text>
    <text x="14" y="38" font-family="Inter, sans-serif" font-size="11" fill="#e7e0d0">impregnação marrom-esverdeada</text>
  </g>

  <!-- Footer -->
  <text x="40" y="588" font-family="Inter, sans-serif" font-size="10" fill="#8a8678">
    Ilustração esquemática autoral Bauer Neonatologia · 2026 · anonimização facial absoluta
  </text>
</svg>
