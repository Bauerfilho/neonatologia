<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="b47-title b47-desc">
  <title id="b47-title">Comparação visual de líquido amniótico: normal, meconial fluido e meconial espesso</title>
  <desc id="b47-desc">Esquema comparativo em três painéis lado a lado representando líquido amniótico normal claro, meconial fluido verde-amarelado e meconial espesso verde-marrom tipo ervilhada, mostrando gradação progressiva de risco para Síndrome da Aspiração de Mecônio.</desc>
  <defs>
    <radialGradient id="bg-b47" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#142838"/>
      <stop offset="65%" stop-color="#0f1f2c"/>
      <stop offset="100%" stop-color="#0a1620"/>
    </radialGradient>

    <!-- Cubas: gradient cinza-aço bordo metálico -->
    <linearGradient id="bowl-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8b2bd"/>
      <stop offset="100%" stop-color="#4a5560"/>
    </linearGradient>
    <linearGradient id="bowl-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a6470"/>
      <stop offset="100%" stop-color="#2a323b"/>
    </linearGradient>

    <!-- Líquido NORMAL: amarelo-claro translúcido -->
    <radialGradient id="liquid-normal" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="rgba(255,243,196,0.95)"/>
      <stop offset="60%" stop-color="rgba(240,220,150,0.85)"/>
      <stop offset="100%" stop-color="rgba(180,160,100,0.75)"/>
    </radialGradient>

    <!-- Líquido MECONIAL FLUIDO: verde-amarelado claro -->
    <radialGradient id="liquid-fluid" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="rgba(190,210,90,0.92)"/>
      <stop offset="60%" stop-color="rgba(140,170,60,0.88)"/>
      <stop offset="100%" stop-color="rgba(90,120,40,0.85)"/>
    </radialGradient>

    <!-- Líquido MECONIAL ESPESSO: verde-marrom escuro -->
    <radialGradient id="liquid-thick" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="rgba(110,90,40,0.95)"/>
      <stop offset="50%" stop-color="rgba(75,60,25,0.96)"/>
      <stop offset="100%" stop-color="rgba(45,35,15,0.98)"/>
    </radialGradient>

    <!-- Brilho especular do líquido -->
    <linearGradient id="liquid-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <rect width="720" height="360" fill="url(#bg-b47)"/>

  <!-- Tag-topo: identificação do esquema -->
  <g transform="translate(20,14)">
    <rect width="680" height="32" rx="9" fill="rgba(108,180,232,0.14)" stroke="rgba(108,180,232,0.40)" stroke-width="1"/>
    <circle cx="18" cy="16" r="4.5" fill="#6cb4e8"/>
    <text x="32" y="21" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#f3ede0" letter-spacing="0.5">LÍQUIDO AMNIÓTICO · GRADAÇÃO VISUAL · RISCO PROGRESSIVO DE SAM</text>
  </g>

  <!-- ============ PAINEL 1: NORMAL ============ -->
  <g transform="translate(40,68)">
    <!-- Card de fundo -->
    <rect width="200" height="220" rx="14" fill="rgba(95,207,128,0.06)" stroke="rgba(95,207,128,0.40)" stroke-width="1.2"/>

    <!-- Label header -->
    <rect x="14" y="14" width="172" height="26" rx="6" fill="rgba(95,207,128,0.18)"/>
    <text x="100" y="32" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#5fcf80" letter-spacing="0.4">NORMAL · REFERÊNCIA</text>

    <!-- Cuba: corpo elíptico -->
    <g transform="translate(100,128)">
      <!-- Borda externa (rim) -->
      <ellipse cx="0" cy="0" rx="74" ry="22" fill="url(#bowl-rim)"/>
      <!-- Corpo interno -->
      <ellipse cx="0" cy="0" rx="68" ry="18" fill="#1a2530"/>
      <!-- Líquido -->
      <ellipse cx="0" cy="-2" rx="66" ry="16" fill="url(#liquid-normal)"/>
      <!-- Brilho especular -->
      <ellipse cx="-20" cy="-9" rx="28" ry="4" fill="url(#liquid-shine)" opacity="0.7"/>
      <!-- Profundidade da cuba lateral -->
      <path d="M -74 0 Q -68 32, -40 38 Q 0 44, 40 38 Q 68 32, 74 0"
            fill="url(#bowl-body)" stroke="rgba(0,0,0,0.4)" stroke-width="0.8"/>
    </g>

    <!-- Descrição -->
    <text x="100" y="200" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#f3ede0">Claro · amarelado</text>
    <text x="100" y="214" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="11" font-weight="500" fill="#c3bcae">levemente turvo · sem risco</text>
  </g>

  <!-- ============ PAINEL 2: MECONIAL FLUIDO ============ -->
  <g transform="translate(260,68)">
    <rect width="200" height="220" rx="14" fill="rgba(240,180,64,0.06)" stroke="rgba(240,180,64,0.45)" stroke-width="1.2"/>

    <rect x="14" y="14" width="172" height="26" rx="6" fill="rgba(240,180,64,0.20)"/>
    <text x="100" y="32" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#f0b440" letter-spacing="0.4">MECONIAL FLUIDO</text>

    <g transform="translate(100,128)">
      <ellipse cx="0" cy="0" rx="74" ry="22" fill="url(#bowl-rim)"/>
      <ellipse cx="0" cy="0" rx="68" ry="18" fill="#1a2530"/>
      <ellipse cx="0" cy="-2" rx="66" ry="16" fill="url(#liquid-fluid)"/>
      <!-- Partículas de mecônio fluido suspensas -->
      <g fill="rgba(80,90,30,0.6)">
        <circle cx="-30" cy="-4" r="1.2"/>
        <circle cx="-10" cy="2" r="0.9"/>
        <circle cx="14" cy="-3" r="1.3"/>
        <circle cx="34" cy="0" r="1"/>
        <circle cx="-44" cy="3" r="0.8"/>
        <circle cx="48" cy="-2" r="0.9"/>
        <circle cx="0" cy="-6" r="1.1"/>
        <circle cx="22" cy="5" r="0.7"/>
      </g>
      <ellipse cx="-20" cy="-9" rx="28" ry="4" fill="url(#liquid-shine)" opacity="0.55"/>
      <path d="M -74 0 Q -68 32, -40 38 Q 0 44, 40 38 Q 68 32, 74 0"
            fill="url(#bowl-body)" stroke="rgba(0,0,0,0.4)" stroke-width="0.8"/>
    </g>

    <text x="100" y="200" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#f3ede0">Verde-amarelado · fluido</text>
    <text x="100" y="214" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="11" font-weight="500" fill="#c3bcae">risco moderado de SAM</text>
  </g>

  <!-- ============ PAINEL 3: MECONIAL ESPESSO ============ -->
  <g transform="translate(480,68)">
    <rect width="200" height="220" rx="14" fill="rgba(255,93,107,0.08)" stroke="rgba(255,93,107,0.50)" stroke-width="1.2"/>

    <rect x="14" y="14" width="172" height="26" rx="6" fill="rgba(255,93,107,0.22)"/>
    <text x="100" y="32" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#ff5d6b" letter-spacing="0.4">MECONIAL ESPESSO</text>

    <g transform="translate(100,128)">
      <ellipse cx="0" cy="0" rx="74" ry="22" fill="url(#bowl-rim)"/>
      <ellipse cx="0" cy="0" rx="68" ry="18" fill="#1a2530"/>
      <!-- Liquido espesso tipo ervilhada -->
      <ellipse cx="0" cy="-2" rx="66" ry="16" fill="url(#liquid-thick)"/>
      <!-- Grumos espessos no topo (textura ervilhada) -->
      <g fill="rgba(50,40,20,1)" stroke="rgba(30,25,12,1)" stroke-width="0.4">
        <ellipse cx="-30" cy="-7" rx="11" ry="5"/>
        <ellipse cx="-8" cy="-9" rx="9" ry="4"/>
        <ellipse cx="14" cy="-6" rx="13" ry="5.5"/>
        <ellipse cx="38" cy="-8" rx="10" ry="4.5"/>
        <ellipse cx="-50" cy="-5" rx="8" ry="3.5"/>
        <ellipse cx="52" cy="-4" rx="6" ry="3"/>
        <ellipse cx="0" cy="-3" rx="7" ry="3"/>
        <ellipse cx="26" cy="2" rx="6" ry="2.5"/>
        <ellipse cx="-20" cy="3" rx="5" ry="2.5"/>
      </g>
      <!-- Sem brilho especular - opaco -->
      <path d="M -74 0 Q -68 32, -40 38 Q 0 44, 40 38 Q 68 32, 74 0"
            fill="url(#bowl-body)" stroke="rgba(0,0,0,0.4)" stroke-width="0.8"/>
    </g>

    <text x="100" y="200" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#f3ede0">Verde-marrom · ervilhada</text>
    <text x="100" y="214" text-anchor="middle" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="11" font-weight="500" fill="#c3bcae">alto risco · aspiração distal</text>
  </g>

  <!-- Setas de gradação progressiva entre painéis -->
  <g fill="#f0b440" opacity="0.85">
    <path d="M 244 178 L 256 178 L 256 174 L 264 180 L 256 186 L 256 182 L 244 182 z"/>
  </g>
  <g fill="#ff5d6b" opacity="0.85">
    <path d="M 464 178 L 476 178 L 476 174 L 484 180 L 476 186 L 476 182 L 464 182 z"/>
  </g>

  <!-- Rodapé: regra clínica -->
  <g transform="translate(40,308)">
    <rect width="640" height="38" rx="9" fill="rgba(255,107,90,0.10)" stroke="rgba(255,107,90,0.40)" stroke-width="1"/>
    <circle cx="20" cy="19" r="4.5" fill="#ff6b5a"/>
    <text x="34" y="17" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#ff8a7a">REGRA CLÍNICA</text>
    <text x="34" y="31" font-family="-apple-system,SF Pro Text,Inter,system-ui,sans-serif" font-size="11" font-weight="500" fill="#f3ede0">Mecônio espesso = maior risco de SAM grave + aspiração distal + necessidade de via aérea avançada</text>
  </g>
</svg>
