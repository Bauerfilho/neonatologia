      <stop offset="100%" stop-color="#1d2a36" stop-opacity="0.30"/>
    </radialGradient>
    <radialGradient id="heart-b34" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#c8cdd4" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#9aa3ad" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="diaphragm-b34" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c0c6cd" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#7a828c" stop-opacity="0.90"/>
    </linearGradient>
