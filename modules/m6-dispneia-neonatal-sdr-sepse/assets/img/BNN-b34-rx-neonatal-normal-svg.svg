      <stop offset="100%" stop-color="#0a1620"/>
    </radialGradient>
    <radialGradient id="lung-b34" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3a4a58" stop-opacity="0.55"/>
