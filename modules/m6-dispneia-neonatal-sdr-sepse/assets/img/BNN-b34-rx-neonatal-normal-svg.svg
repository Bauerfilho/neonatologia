<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title-b34 desc-b34">
  <title id="title-b34">Radiografia de torax neonatal normal</title>
  <desc id="desc-b34">Esquema de radiografia de torax neonatal normal mostrando pulmoes transparentes bilateralmente expandidos, diafragma em oitavo a nono arco costal posterior, silhueta cardiaca com indice cardiotoracico inferior a zero virgula seis e trama vascular pulmonar normal. Referencia anatomica para contraste com padroes patologicos como sindrome do desconforto respiratorio.</desc>
