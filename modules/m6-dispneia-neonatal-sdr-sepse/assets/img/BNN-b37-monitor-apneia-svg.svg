<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title-b37 desc-b37">
  <title id="title-b37">Episodio de apneia significativa em recem-nascido pre-termo</title>
  <desc id="desc-b37">Esquema de monitor multiparametros bedside neonatal mostrando episodio de apneia significativa em recem-nascido pre-termo. Canal de frequencia respiratoria evidencia pausa respiratoria superior a vinte segundos. Canal de frequencia cardiaca cai abaixo de cem batimentos por minuto caracterizando bradicardia. Canal de saturacao de oxigenio cai abaixo de oitenta e cinco por cento caracterizando dessaturacao. Triade classica do evento apneico significativo.</desc>
