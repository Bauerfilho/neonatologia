    <text x="66" y="318" fill="#f3ede0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="7" text-anchor="middle" font-weight="600">CPAP</text>

    <g transform="translate(218,168)">
