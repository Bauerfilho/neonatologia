    <ellipse cx="167" cy="263" rx="3" ry="2.2" fill="rgba(108,180,232,0.35)" stroke="#6cb4e8" stroke-width="1"/>
    <path d="M 138 263 Q 110 258 88 262 Q 70 266 62 282 Q 60 296 72 304" fill="none" stroke="#6cb4e8" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 172 263 Q 200 258 222 262 Q 240 266 248 282 Q 250 296 238 304" fill="none" stroke="#6cb4e8" stroke-width="2.2" stroke-linecap="round"/>

