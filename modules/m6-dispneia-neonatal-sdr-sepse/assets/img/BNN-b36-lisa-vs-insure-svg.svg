<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title-b36 desc-b36">
  <title id="title-b36">Tecnicas LISA e INSURE para administracao de surfactante</title>
  <desc id="desc-b36">Esquema didatico comparando tecnicas LISA e INSURE para administracao de surfactante em recem-nascido pre-termo. LISA preserva respiracao espontanea durante cateterizacao fina por laringoscopia direta com pronga nasal CPAP mantida. INSURE requer intubacao orotraqueal transitoria com ventilacao por pressao positiva para administracao do surfactante e posterior extubacao.</desc>
  <defs>
    <radialGradient id="bg-b36" cx="50%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#142838"/>
      <stop offset="100%" stop-color="#0a1620"/>
    </radialGradient>
    <radialGradient id="skin-b36" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f7e0d2"/>
      <stop offset="100%" stop-color="#dab09a"/>
    </radialGradient>
    <linearGradient id="lisa-panel-b36" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(95,207,128,0.10)"/>
      <stop offset="100%" stop-color="rgba(95,207,128,0.04)"/>
    </linearGradient>
    <linearGradient id="insure-panel-b36" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(240,180,64,0.10)"/>
      <stop offset="100%" stop-color="rgba(240,180,64,0.04)"/>
    </linearGradient>
    <linearGradient id="surfactant-b36" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff6d8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffd06a" stop-opacity="0.85"/>
    </linearGradient>
    <marker id="arrow-b36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a7a"/>
    </marker>
    <marker id="arrow-amber-b36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f0b440"/>
    </marker>
  </defs>

  <rect width="720" height="480" fill="url(#bg-b36)"/>

  <rect x="22" y="22" width="676" height="40" rx="10" fill="rgba(108,180,232,0.08)" stroke="rgba(108,180,232,0.40)" stroke-width="1"/>
  <text x="360" y="48" fill="#f3ede0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.6">SURFACTANTE NO RNPT · LISA vs INSURE</text>

  <rect x="22" y="78" width="332" height="378" rx="16" fill="url(#lisa-panel-b36)" stroke="rgba(95,207,128,0.42)" stroke-width="1.2"/>
  <rect x="366" y="78" width="332" height="378" rx="16" fill="url(#insure-panel-b36)" stroke="rgba(240,180,64,0.42)" stroke-width="1.2"/>

  <text x="188" y="104" fill="#7ad6a8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0.4">LISA</text>
  <text x="188" y="122" fill="#f3ede0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="10" text-anchor="middle" opacity="0.85">Less Invasive Surfactant Administration</text>

  <text x="532" y="104" fill="#f0b440" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="0.4">INSURE</text>
  <text x="532" y="122" fill="#f3ede0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="10" text-anchor="middle" opacity="0.85">INtubation · SURfactant · Extubation</text>

