    <ellipse cx="156" cy="225" rx="8" ry="6" fill="url(#surfactant-b36)" opacity="0.85"/>
    <path d="M 156 232 Q 152 250 156 268 Q 160 250 156 232 z" fill="url(#surfactant-b36)" opacity="0.65"/>

    <text x="220" y="160" fill="#f0b440" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="9" font-weight="700">VPP / Ambu</text>
    <line x1="218" y1="160" x2="174" y2="158" stroke="#f0b440" stroke-width="1.2" marker-end="url(#arrow-amber-b36)"/>

    <text x="220" y="220" fill="#f0b440" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="9" font-weight="700">TOT</text>
    <line x1="218" y1="220" x2="170" y2="228" stroke="#f0b440" stroke-width="1.2" marker-end="url(#arrow-amber-b36)"/>

    <text x="220" y="282" fill="#f0b440" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="9" font-weight="700">Surfactante</text>
    <text x="220" y="294" fill="#f0b440" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="9" font-weight="700">via tubo</text>
    <line x1="218" y1="282" x2="170" y2="266" stroke="#f0b440" stroke-width="1.2" marker-end="url(#arrow-amber-b36)"/>

    <g transform="translate(40,310)">
      <rect x="0" y="0" width="86" height="22" rx="6" fill="rgba(108,180,232,0.14)" stroke="rgba(108,180,232,0.45)" stroke-width="1"/>
      <text x="43" y="14" fill="#6cb4e8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="9" text-anchor="middle" font-weight="700">1 · INtubar</text>

      <path d="M 90 11 L 102 11" stroke="#f0b440" stroke-width="1.2" marker-end="url(#arrow-amber-b36)"/>

      <rect x="104" y="0" width="86" height="22" rx="6" fill="rgba(240,180,64,0.14)" stroke="rgba(240,180,64,0.45)" stroke-width="1"/>
      <text x="147" y="14" fill="#f0b440" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="9" text-anchor="middle" font-weight="700">2 · SURfactante</text>

      <path d="M 194 11 L 206 11" stroke="#f0b440" stroke-width="1.2" marker-end="url(#arrow-amber-b36)"/>

      <rect x="208" y="0" width="86" height="22" rx="6" fill="rgba(95,207,128,0.14)" stroke="rgba(95,207,128,0.45)" stroke-width="1"/>
