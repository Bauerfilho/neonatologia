    <text x="188" y="358" fill="#f0b440" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.3">VENTILACAO INVASIVA TRANSITORIA</text>
    <text x="188" y="370" fill="#f3ede0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="9" text-anchor="middle" opacity="0.85">VPP por tubo orotraqueal durante o bolus</text>

    <rect x="40" y="388" width="296" height="56" rx="8" fill="rgba(255,107,90,0.08)" stroke="rgba(255,107,90,0.32)" stroke-width="1"/>
    <text x="50" y="404" fill="#ff8a7a" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="9" font-weight="700">PASSOS</text>
    <text x="50" y="418" fill="#f3ede0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="9">1 · intubacao orotraqueal · VPP iniciada</text>
    <text x="50" y="430" fill="#f3ede0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="9">2 · surfactante em bolus pelo TOT</text>
    <text x="50" y="442" fill="#f3ede0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="9">3 · extubacao precoce · transicao para CPAP</text>
  </g>

  <rect x="22" y="464" width="676" height="12" rx="6" fill="rgba(255,107,90,0.08)" stroke="rgba(255,107,90,0.30)" stroke-width="0.8"/>
  <text x="360" y="474" fill="#ff8a7a" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.3">LISA evita ventilacao invasiva mesmo brevemente · vantagem no RNPT com drive respiratorio adequado</text>
