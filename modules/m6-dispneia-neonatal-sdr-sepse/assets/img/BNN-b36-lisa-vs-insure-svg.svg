    <text x="248" y="216" fill="#ff8a7a" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="9" font-weight="600">Cateter fino</text>
    <text x="248" y="227" fill="#ff8a7a" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="9" font-weight="600">flexivel</text>

    <rect x="40" y="345" width="296" height="32" rx="8" fill="rgba(95,207,128,0.12)" stroke="rgba(95,207,128,0.40)" stroke-width="1"/>
    <text x="188" y="358" fill="#7ad6a8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.3">RESPIRACAO ESPONTANEA PRESERVADA</text>
    <text x="188" y="370" fill="#f3ede0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="9" text-anchor="middle" opacity="0.85">CPAP nasal mantido durante todo o procedimento</text>

    <rect x="40" y="388" width="296" height="56" rx="8" fill="rgba(255,107,90,0.08)" stroke="rgba(255,107,90,0.32)" stroke-width="1"/>
    <text x="50" y="404" fill="#ff8a7a" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="9" font-weight="700">PASSOS</text>
    <text x="50" y="418" fill="#f3ede0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="9">1 · CPAP nasal estabelecido</text>
    <text x="50" y="430" fill="#f3ede0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="9">2 · laringoscopia direta · cateter fino na traqueia</text>
    <text x="50" y="442" fill="#f3ede0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="9">3 · surfactante em bolus · cateter retirado · CPAP segue</text>
  </g>

  <g transform="translate(344,0)">
    <ellipse cx="155" cy="240" rx="48" ry="56" fill="url(#skin-b36)" stroke="#a37e64" stroke-width="1.4"/>
    <path d="M 145 196 Q 155 192 165 196" fill="none" stroke="#7a5a48" stroke-width="1.2"/>

    <ellipse cx="142" cy="234" rx="5" ry="3" fill="#fafafa" stroke="#7a5a48" stroke-width="0.7"/>
    <circle cx="142" cy="234" r="1.6" fill="#3a5560"/>
    <ellipse cx="168" cy="234" rx="5" ry="3" fill="#fafafa" stroke="#7a5a48" stroke-width="0.7"/>
