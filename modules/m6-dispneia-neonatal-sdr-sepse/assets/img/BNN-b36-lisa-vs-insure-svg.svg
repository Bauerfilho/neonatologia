      <path d="M 44 0 L 56 7 L 44 14 z" fill="#3d5a6e" stroke="#5a7a8c" stroke-width="0.8"/>
      <path d="M 0 7 L -18 7 L -18 36" fill="none" stroke="#3d5a6e" stroke-width="2"/>
      <text x="22" y="10" fill="#f3ede0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="7" text-anchor="middle" font-weight="600">LARINGOSCOPIO</text>
    </g>

    <path d="M 235 215 L 195 240 L 180 252 L 165 268 L 158 282"
