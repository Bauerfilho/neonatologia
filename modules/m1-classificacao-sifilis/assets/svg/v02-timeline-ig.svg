<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="Linha do tempo gestacional de 22 a 44 semanas, dividida em cinco faixas coloridas: pré-termo extremo (menos de 28 semanas, vermelho), pré-termo moderado (28 a 33 semanas e 6 dias, laranja), pré-termo tardio (34 a 36 semanas e 6 dias, amarelo), termo (37 a 41 semanas e 6 dias, verde) e pós-termo (42 semanas ou mais, laranja). João Eucalipto está marcado na faixa de pré-termo tardio aos 36 semanas e 4 dias.">
  <defs>
    <pattern id="hatch-extremo" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#ff5d6b" stroke-width="3"/>
    </pattern>
    <pattern id="hatch-moderado" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#f0b440" stroke-width="2"/>
    </pattern>
    <pattern id="hatch-tardio" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#d4a017" stroke-width="1.4"/>
    </pattern>
    <pattern id="hatch-termo" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(0)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#5fcf80" stroke-width="2"/>
    </pattern>
  </defs>
  <!-- 22 → 44 semanas, total 22 unidades em x=40 a x=680 (largura 640px, 29.09 px por semana) -->
  <!-- Faixas -->
  <g>
    <rect x="40"  y="80" width="174" height="60" fill="url(#hatch-extremo)"  opacity="0.55"/>
    <rect x="214" y="80" width="174" height="60" fill="url(#hatch-moderado)" opacity="0.45"/>
    <rect x="388" y="80" width="84"  height="60" fill="url(#hatch-tardio)"   opacity="0.45"/>
    <rect x="472" y="80" width="146" height="60" fill="url(#hatch-termo)"    opacity="0.55"/>
    <rect x="618" y="80" width="62"  height="60" fill="url(#hatch-moderado)" opacity="0.45"/>
  </g>
  <!-- Eixo -->
  <line x1="40" y1="140" x2="680" y2="140" stroke="#c3bcae" stroke-width="1.5"/>
  <!-- Marcadores semana 28, 34, 37, 42 -->
  <g font-family="JetBrains Mono, monospace" font-size="11" fill="#e7e0d0" text-anchor="middle">
    <line x1="40"  y1="78" x2="40"  y2="148" stroke="#8a8678" stroke-width="1"/><text x="40"  y="166">22</text>
    <line x1="214" y1="78" x2="214" y2="148" stroke="#ff5d6b" stroke-width="2"/><text x="214" y="166" fill="#ff5d6b">28</text>
    <line x1="388" y1="78" x2="388" y2="148" stroke="#f0b440" stroke-width="2"/><text x="388" y="166" fill="#f0b440">34</text>
    <line x1="472" y1="78" x2="472" y2="148" stroke="#5fcf80" stroke-width="2"/><text x="472" y="166" fill="#5fcf80">37</text>
    <line x1="618" y1="78" x2="618" y2="148" stroke="#f0b440" stroke-width="2"/><text x="618" y="166" fill="#f0b440">42</text>
    <line x1="680" y1="78" x2="680" y2="148" stroke="#8a8678" stroke-width="1"/><text x="680" y="166">44</text>
  </g>
  <!-- Labels faixas -->
  <g font-family="Lora, serif" font-size="11" fill="#f3ede0" text-anchor="middle">
    <text x="127" y="108">Pré-termo extremo</text>
    <text x="301" y="108">Pré-termo moderado</text>
    <text x="430" y="108">Tardio</text>
    <text x="545" y="108">Termo</text>
    <text x="649" y="108">Pós-termo</text>
  </g>
  <!-- João Eucalipto (36+4 sem) — entre 34 e 37, na faixa tardio -->
  <!-- Posição: 36+4/7 = 36.57; (36.57-22)*29.09 + 40 = 463.84 -->
  <g>
    <circle cx="464" cy="62" r="9" fill="#ff6b5a" stroke="#0a1620" stroke-width="2"/>
    <line x1="464" y1="71" x2="464" y2="80" stroke="#ff6b5a" stroke-width="2"/>
    <text x="464" y="50" font-family="Lora, serif" font-size="12" fill="#ff6b5a" text-anchor="middle" font-weight="700">João · 36+4</text>
  </g>
  <!-- Eixo título -->
  <text x="360" y="200" font-family="JetBrains Mono, monospace" font-size="11" fill="#8a8678" text-anchor="middle">Semanas de idade gestacional</text>
  <text x="360" y="30"  font-family="Lora, serif" font-size="14" fill="#f3ede0" text-anchor="middle">Linha do tempo gestacional — 22 a 44 sem</text>
</svg>
