<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 320" role="img" aria-label="Escala vertical de classificação por peso ao nascer. Três cortes horizontais: 2.500 gramas (acima é adequado), 1.500 gramas e 1.000 gramas. Três faixas coloridas: baixo peso entre 1.500 e 2.499 gramas, muito baixo peso entre 1.000 e 1.499 gramas, e extremo baixo peso abaixo de 1.000 gramas. As faixas de muito baixo peso e extremo baixo peso aparecem destacadas com indicação de que correspondem obrigatoriamente a recém-nascidos pré-termo. João Eucalipto está marcado em 1.900 gramas, na faixa de baixo peso.">
  <defs>
    <pattern id="hatch-bp" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#f0b440" stroke-width="2"/>
    </pattern>
    <pattern id="hatch-mbp" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#ff5d6b" stroke-width="2"/>
    </pattern>
    <pattern id="hatch-ebp" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#ff5d6b" stroke-width="3"/>
    </pattern>
  </defs>
  <!-- Y axis: 0 (bottom) → 4000g (top). Mapeio entre y=270 e y=30 (240px de área útil) -->
  <!-- 4000g → y=30; 2500g → y=120; 1500g → y=180; 1000g → y=210; 0g → y=270 (mas paramos visualmente em ~500g) -->
  <g>
    <!-- Adequado: 2500-4000g -->
    <rect x="40" y="30"  width="80" height="90" fill="#5fcf80" opacity="0.18" stroke="#5fcf80" stroke-width="1"/>
    <!-- BP: 1500-2499g -->
    <rect x="40" y="120" width="80" height="60" fill="url(#hatch-bp)" opacity="0.55"/>
    <!-- MBP: 1000-1499g -->
    <rect x="40" y="180" width="80" height="30" fill="url(#hatch-mbp)" opacity="0.55"/>
    <!-- EBP: <1000g -->
    <rect x="40" y="210" width="80" height="60" fill="url(#hatch-ebp)" opacity="0.7"/>
  </g>
  <!-- Linhas de corte -->
  <g stroke-dasharray="4 2">
    <line x1="40" y1="120" x2="180" y2="120" stroke="#5fcf80" stroke-width="1.5"/>
    <line x1="40" y1="180" x2="180" y2="180" stroke="#f0b440" stroke-width="1.5"/>
    <line x1="40" y1="210" x2="180" y2="210" stroke="#ff5d6b" stroke-width="1.5"/>
  </g>
  <!-- Labels de peso -->
  <g font-family="JetBrains Mono, monospace" font-size="10" fill="#e7e0d0" text-anchor="start">
    <text x="124" y="124">2.500 g</text>
    <text x="124" y="184">1.500 g</text>
    <text x="124" y="214">1.000 g</text>
  </g>
  <!-- Labels faixas -->
  <g font-family="Lora, serif" font-size="10" fill="#f3ede0" text-anchor="middle">
    <text x="80" y="78">Adequado</text>
    <text x="80" y="155">BP</text>
    <text x="80" y="199">MBP</text>
    <text x="80" y="244">EBP</text>
  </g>
  <!-- "obrigatório pré-termo" -->
  <g font-family="Lora, serif" font-size="8" fill="#ff5d6b" font-style="italic">
    <text x="124" y="199">sempre pré-termo</text>
    <text x="124" y="244">sempre pré-termo</text>
  </g>
  <!-- João Eucalipto: 1.900g → entre 1500 (y=180) e 2500 (y=120). 1900 → y=180 - (400/1000)*60 = 180-24 = 156 -->
  <g>
    <circle cx="40" cy="156" r="6" fill="#ff6b5a" stroke="#0a1620" stroke-width="1.5"/>
    <line x1="32" y1="156" x2="20" y2="156" stroke="#ff6b5a" stroke-width="1.5"/>
    <text x="18" y="160" font-family="Lora, serif" font-size="10" fill="#ff6b5a" text-anchor="end" font-weight="700">João</text>
    <text x="18" y="172" font-family="JetBrains Mono, monospace" font-size="9" fill="#ff6b5a" text-anchor="end">1.900 g</text>
  </g>
  <!-- Eixo Y -->
  <line x1="40" y1="30" x2="40" y2="270" stroke="#c3bcae" stroke-width="1.5"/>
  <text x="110" y="22"  font-family="Lora, serif" font-size="11" fill="#f3ede0" text-anchor="middle">Peso ao nascer</text>
  <text x="110" y="295" font-family="JetBrains Mono, monospace" font-size="9" fill="#8a8678" text-anchor="middle">Eixo: gramas</text>
</svg>
