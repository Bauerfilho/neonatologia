<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Esquema didático mostrando a placenta como barreira seletiva. Moléculas de imunoglobulina M (IgM), grandes em forma de pentâmero, são barradas pela placenta e não passam da circulação materna para a fetal. Moléculas de imunoglobulina G (IgG), pequenas em forma de Y, atravessam livremente a placenta. A conclusão clínica destacada: IgM detectada no recém-nascido é sempre produzida pelo próprio bebê; IgG no recém-nascido pode ter sido produzida pelo bebê ou ter vindo da mãe por transferência passiva.">
  <defs>
    <!-- Pentâmero IgM -->
    <symbol id="igm" viewBox="-20 -20 40 40">
      <polygon points="0,-15 14,-5 9,12 -9,12 -14,-5" fill="none" stroke="#ff5d6b" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#ff5d6b" opacity="0.3"/>
    </symbol>
    <!-- IgG (Y) -->
    <symbol id="igg" viewBox="-10 -10 20 20">
      <path d="M 0,5 L 0,-2 M 0,-2 L -5,-7 M 0,-2 L 5,-7" stroke="#5fcf80" stroke-width="2" fill="none" stroke-linecap="round"/>
    </symbol>
  </defs>

  <!-- Lado materno (esquerda) -->
  <rect x="20" y="50" width="200" height="220" rx="12" fill="#142838" stroke="#ff8a7a" stroke-width="1" opacity="0.85"/>
  <text x="120" y="40" font-family="Lora, serif" font-size="14" fill="#ff8a7a" text-anchor="middle" font-weight="600">Circulação MATERNA</text>

  <!-- Lado fetal (direita) -->
  <rect x="500" y="50" width="200" height="220" rx="12" fill="#142838" stroke="#6cb4e8" stroke-width="1" opacity="0.85"/>
  <text x="600" y="40" font-family="Lora, serif" font-size="14" fill="#6cb4e8" text-anchor="middle" font-weight="600">Circulação FETAL</text>

  <!-- Placenta (barreira central) -->
  <g>
    <rect x="280" y="40" width="160" height="240" rx="40" fill="#1a3245" stroke="#c3bcae" stroke-width="1.5"/>
    <text x="360" y="30" font-family="Lora, serif" font-size="13" fill="#c3bcae" text-anchor="middle" font-style="italic">Placenta — barreira seletiva</text>
    <!-- Vilo coriônico simbólico -->
    <path d="M 360,70 Q 340,90 360,110 Q 380,130 360,150 Q 340,170 360,190 Q 380,210 360,230 Q 340,250 360,260" stroke="#8a8678" stroke-width="2" fill="none"/>
  </g>

  <!-- IgM no lado materno (3 moléculas grandes) -->
  <g>
    <use href="#igm" x="80"  y="100" width="40" height="40"/>
    <use href="#igm" x="140" y="160" width="40" height="40"/>
    <use href="#igm" x="80"  y="220" width="40" height="40"/>
  </g>

  <!-- IgG passando livremente — algumas no materno, várias no fetal -->
  <g>
    <use href="#igg" x="160" y="90"  width="22" height="22"/>
    <use href="#igg" x="80"  y="150" width="22" height="22"/>
    <use href="#igg" x="180" y="240" width="22" height="22"/>
    <!-- Atravessando: setas verdes -->
    <path d="M 200,100 Q 280,100 360,110" stroke="#5fcf80" stroke-width="1.5" fill="none" stroke-dasharray="3 2"/>
    <path d="M 200,160 Q 280,160 360,170" stroke="#5fcf80" stroke-width="1.5" fill="none" stroke-dasharray="3 2"/>
    <!-- IgG do lado fetal -->
    <use href="#igg" x="540" y="100" width="22" height="22"/>
    <use href="#igg" x="600" y="160" width="22" height="22"/>
    <use href="#igg" x="540" y="220" width="22" height="22"/>
  </g>

  <!-- IgM bloqueada: tentativa + X vermelho -->
  <g>
    <path d="M 200,180 Q 250,180 280,180" stroke="#ff5d6b" stroke-width="1.5" fill="none" stroke-dasharray="3 2"/>
    <g transform="translate(290,170)">
      <line x1="0" y1="0" x2="18" y2="18" stroke="#ff5d6b" stroke-width="3"/>
      <line x1="18" y1="0" x2="0" y2="18" stroke="#ff5d6b" stroke-width="3"/>
    </g>
  </g>

  <!-- Legendas -->
  <g font-family="Lora, serif" font-size="11">
    <g transform="translate(20,290)">
      <use href="#igm" x="0" y="0" width="20" height="20"/>
      <text x="28" y="14" fill="#ff5d6b">IgM (pentâmero — grande)</text>
    </g>
    <g transform="translate(280,290)">
      <use href="#igg" x="0" y="0" width="16" height="16"/>
      <text x="24" y="12" fill="#5fcf80">IgG (Y — pequena)</text>
    </g>
  </g>

  <!-- Conclusão -->
  <g>
    <text x="600" y="290" font-family="Lora, serif" font-size="11" fill="#f3ede0" text-anchor="middle" font-weight="700">IgM no RN = certeza do bebê</text>
    <text x="600" y="306" font-family="Lora, serif" font-size="10" fill="#c3bcae" text-anchor="middle" font-style="italic">IgG no RN = curva decide</text>
  </g>
</svg>
