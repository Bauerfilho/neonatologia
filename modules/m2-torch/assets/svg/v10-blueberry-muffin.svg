<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" role="img" aria-label="Ilustração esquemática didática de recém-nascido visto frontalmente, anonimizado, com múltiplas máculas e pápulas purpúricas distribuídas pelo tronco, face e membros — padrão difuso conhecido como aspecto de 'blueberry muffin' (cupcake de mirtilo). Associado a infecções congênitas, especialmente citomegalovirose (CMV) e síndrome da rubéola congênita.">
  <defs>
    <radialGradient id="skin" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f7e2d3"/>
      <stop offset="100%" stop-color="#d8b8a0"/>
    </radialGradient>
  </defs>

  <!-- Fundo -->
  <rect x="0" y="0" width="280" height="320" fill="#0f1f2c" rx="12"/>

  <!-- Silhueta bebê (anonimizada) -->
  <!-- Cabeça -->
  <ellipse cx="140" cy="60" rx="38" ry="42" fill="url(#skin)" stroke="#c3bcae" stroke-width="1"/>
  <!-- Pescoço -->
  <rect x="125" y="96" width="30" height="14" fill="url(#skin)"/>
  <!-- Tronco -->
  <path d="M 95,110 Q 95,100 110,100 L 170,100 Q 185,100 185,110 L 185,200 Q 185,210 175,215 L 105,215 Q 95,210 95,200 Z" fill="url(#skin)" stroke="#c3bcae" stroke-width="1"/>
  <!-- Braços -->
  <path d="M 90,115 Q 70,135 65,180 Q 63,210 75,225" stroke="url(#skin)" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M 190,115 Q 210,135 215,180 Q 217,210 205,225" stroke="url(#skin)" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- Pernas -->
  <path d="M 125,215 Q 120,250 122,290" stroke="url(#skin)" stroke-width="26" fill="none" stroke-linecap="round"/>
  <path d="M 155,215 Q 160,250 158,290" stroke="url(#skin)" stroke-width="26" fill="none" stroke-linecap="round"/>

  <!-- Lesões purpúricas blueberry-muffin -->
  <g>
    <!-- Face -->
    <circle cx="125" cy="55" r="3.5" fill="#6e3a8a" opacity="0.8"/>
    <circle cx="153" cy="48" r="3" fill="#5a2870" opacity="0.85"/>
    <circle cx="160" cy="68" r="3" fill="#7a4598" opacity="0.75"/>
    <circle cx="130" cy="78" r="2.8" fill="#5a2870" opacity="0.85"/>
    <!-- Tronco -->
    <circle cx="115" cy="125" r="3.5" fill="#6e3a8a" opacity="0.8"/>
    <circle cx="140" cy="120" r="3" fill="#5a2870" opacity="0.85"/>
    <circle cx="165" cy="130" r="3.2" fill="#7a4598" opacity="0.8"/>
    <circle cx="125" cy="145" r="3" fill="#5a2870" opacity="0.85"/>
    <circle cx="155" cy="148" r="3.5" fill="#6e3a8a" opacity="0.8"/>
    <circle cx="105" cy="160" r="2.5" fill="#5a2870" opacity="0.8"/>
    <circle cx="135" cy="165" r="3.5" fill="#6e3a8a" opacity="0.85"/>
    <circle cx="170" cy="170" r="3" fill="#5a2870" opacity="0.85"/>
    <circle cx="120" cy="185" r="3" fill="#7a4598" opacity="0.75"/>
    <circle cx="150" cy="190" r="3.5" fill="#5a2870" opacity="0.85"/>
    <circle cx="175" cy="200" r="2.8" fill="#6e3a8a" opacity="0.8"/>
    <!-- Braços -->
    <circle cx="78"  cy="140" r="2.8" fill="#6e3a8a" opacity="0.8"/>
    <circle cx="70"  cy="175" r="3"   fill="#5a2870" opacity="0.85"/>
    <circle cx="68"  cy="205" r="2.5" fill="#7a4598" opacity="0.75"/>
    <circle cx="202" cy="140" r="3"   fill="#5a2870" opacity="0.85"/>
    <circle cx="210" cy="175" r="3.2" fill="#6e3a8a" opacity="0.8"/>
    <circle cx="208" cy="205" r="2.5" fill="#7a4598" opacity="0.75"/>
    <!-- Pernas -->
    <circle cx="120" cy="235" r="3"   fill="#6e3a8a" opacity="0.8"/>
    <circle cx="124" cy="260" r="3.2" fill="#5a2870" opacity="0.85"/>
    <circle cx="155" cy="240" r="3"   fill="#5a2870" opacity="0.85"/>
    <circle cx="158" cy="275" r="3"   fill="#6e3a8a" opacity="0.8"/>
  </g>

  <!-- Rótulo -->
  <text x="140" y="312" font-family="Lora, serif" font-size="13" fill="#c3bcae" text-anchor="middle" font-style="italic">aspecto de cupcake de mirtilo</text>
</svg>
