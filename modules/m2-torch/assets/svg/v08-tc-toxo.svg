<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="Corte axial esquemático de crânio infantil mostrando calcificação intracraniana com padrão difuso — múltiplos pontos brancos espalhados pelo parênquima cerebral. Padrão característico de toxoplasmose congênita (sinal de ouro patognomônico).">
  <!-- Fundo TC -->
  <rect x="0" y="0" width="240" height="200" fill="#0a1620" rx="8"/>
  <!-- Crânio -->
  <ellipse cx="120" cy="100" rx="92" ry="78" fill="#142838" stroke="#f3ede0" stroke-width="2"/>
  <!-- Linha sagital -->
  <line x1="120" y1="22" x2="120" y2="178" stroke="#5d5b50" stroke-width="1" stroke-dasharray="2 4"/>
  <!-- Ventrículos sutis (referência anatômica) -->
  <ellipse cx="104" cy="92" rx="14" ry="22" fill="#1a3245" opacity="0.4"/>
  <ellipse cx="136" cy="92" rx="14" ry="22" fill="#1a3245" opacity="0.4"/>
  <!-- Calcificações DIFUSAS — múltiplos pontos espalhados -->
  <g fill="#f3ede0">
    <circle cx="80"  cy="55"  r="2.5"/>
    <circle cx="100" cy="48"  r="2"/>
    <circle cx="120" cy="42"  r="2.3"/>
    <circle cx="140" cy="50"  r="2.4"/>
    <circle cx="160" cy="58"  r="2"/>
    <circle cx="70"  cy="78"  r="2.2"/>
    <circle cx="92"  cy="72"  r="2"/>
    <circle cx="148" cy="68"  r="2.5"/>
    <circle cx="172" cy="78"  r="2"/>
    <circle cx="65"  cy="100" r="2.3"/>
    <circle cx="85"  cy="118" r="2"/>
    <circle cx="155" cy="110" r="2.3"/>
    <circle cx="178" cy="102" r="2"/>
    <circle cx="78"  cy="135" r="2.5"/>
    <circle cx="98"  cy="142" r="2"/>
    <circle cx="118" cy="148" r="2.3"/>
    <circle cx="140" cy="142" r="2.1"/>
    <circle cx="160" cy="135" r="2"/>
    <circle cx="90"  cy="158" r="2.2"/>
    <circle cx="150" cy="158" r="2.3"/>
    <circle cx="110" cy="125" r="1.8"/>
    <circle cx="130" cy="125" r="1.8"/>
    <circle cx="120" cy="158" r="1.6"/>
  </g>
  <!-- Indicação textual -->
  <text x="120" y="195" font-family="Inter, sans-serif" font-size="10" fill="#ff8a7a" text-anchor="middle" font-weight="600" letter-spacing="0.5">DIFUSA · TODO o parênquima</text>
</svg>
