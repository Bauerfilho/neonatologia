<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" role="img" aria-label="Esquema anatômico didático do coração em corte frontal mostrando duas cardiopatias congênitas características da síndrome da rubéola congênita: persistência do canal arterial (PCA) — comunicação anômala persistente entre aorta e artéria pulmonar, com seta indicando fluxo aberrante; e estenose da artéria pulmonar (EAP) — afunilamento da artéria pulmonar com seta indicando obstrução parcial do fluxo. Câmaras cardíacas, átrios e ventrículos identificados.">
  <defs>
    <linearGradient id="bloodArt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8a7a"/>
      <stop offset="100%" stop-color="#ff5d6b"/>
    </linearGradient>
    <linearGradient id="bloodVen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6cb4e8"/>
      <stop offset="100%" stop-color="#4a90c8"/>
    </linearGradient>
  </defs>

  <!-- Fundo card -->
  <rect x="0" y="0" width="480" height="380" fill="#0f1f2c" rx="12"/>

  <!-- Aorta (arco) -->
  <path d="M 230,60 Q 230,30 290,30 Q 350,30 350,80 L 350,150" stroke="url(#bloodArt)" stroke-width="22" fill="none" stroke-linecap="round"/>
  <text x="295" y="22" font-family="Lora, serif" font-size="12" fill="#ff8a7a" text-anchor="middle" font-weight="600">Aorta</text>

  <!-- Tronco / artéria pulmonar (esquerda) com ESTENOSE -->
  <path d="M 210,60 L 210,100" stroke="url(#bloodVen)" stroke-width="22" fill="none" stroke-linecap="round"/>
  <!-- AFUNILAMENTO da estenose -->
  <path d="M 199,100 L 199,115 L 191,130 L 199,145 L 199,170 L 221,170 L 221,145 L 229,130 L 221,115 L 221,100 Z" fill="#6cb4e8" stroke="#1a3245" stroke-width="1"/>
  <text x="155" y="60" font-family="Lora, serif" font-size="12" fill="#6cb4e8" text-anchor="end" font-weight="600">Artéria</text>
  <text x="155" y="74" font-family="Lora, serif" font-size="12" fill="#6cb4e8" text-anchor="end" font-weight="600">pulmonar</text>

  <!-- CANAL ARTERIAL PERSISTENTE (PCA) — entre aorta e art. pulmonar -->
  <path d="M 230,70 Q 220,82 210,75" stroke="#f0b440" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="220" cy="78" r="22" fill="none" stroke="#f0b440" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="260" y="60" font-family="Inter, sans-serif" font-size="11" fill="#f0b440" font-weight="700">PCA</text>
  <!-- Setinha de fluxo aberrante -->
  <path d="M 232,74 L 218,76" stroke="#f0b440" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#f0b440"/>
    </marker>
  </defs>

  <!-- Indicador EAP (estenose artéria pulmonar) -->
  <circle cx="210" cy="130" r="24" fill="none" stroke="#ff5d6b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="155" y="135" font-family="Inter, sans-serif" font-size="11" fill="#ff5d6b" text-anchor="end" font-weight="700">EAP</text>
  <text x="155" y="148" font-family="Inter, sans-serif" font-size="9" fill="#ff8a7a" text-anchor="end" font-style="italic">afunilamento</text>

  <!-- Átrios -->
  <ellipse cx="180" cy="180" rx="55" ry="35" fill="#1a3245" stroke="#c3bcae" stroke-width="1.5"/>
  <text x="180" y="184" font-family="Lora, serif" font-size="14" fill="#f3ede0" text-anchor="middle" font-weight="600">AD</text>
  <ellipse cx="305" cy="180" rx="55" ry="35" fill="#1a3245" stroke="#c3bcae" stroke-width="1.5"/>
  <text x="305" y="184" font-family="Lora, serif" font-size="14" fill="#f3ede0" text-anchor="middle" font-weight="600">AE</text>

  <!-- Septo interatrial -->
  <line x1="243" y1="158" x2="243" y2="202" stroke="#c3bcae" stroke-width="1.5"/>

  <!-- Ventrículos -->
  <path d="M 130,210 L 250,210 L 250,330 L 200,355 L 130,290 Z" fill="#142838" stroke="#c3bcae" stroke-width="1.5"/>
  <text x="190" y="280" font-family="Lora, serif" font-size="14" fill="#f3ede0" text-anchor="middle" font-weight="600">VD</text>
  <path d="M 250,210 L 360,210 L 360,290 L 290,355 L 250,330 Z" fill="#142838" stroke="#c3bcae" stroke-width="1.5"/>
  <text x="305" y="280" font-family="Lora, serif" font-size="14" fill="#f3ede0" text-anchor="middle" font-weight="600">VE</text>

  <!-- Legenda -->
  <g transform="translate(20,355)">
    <rect x="0" y="-12" width="10" height="10" fill="#f0b440"/>
    <text x="16" y="-3" font-family="Inter, sans-serif" font-size="10" fill="#c3bcae"><tspan font-weight="700" fill="#f3ede0">PCA</tspan> = persistência do canal arterial</text>
    <rect x="230" y="-12" width="10" height="10" fill="#ff5d6b"/>
    <text x="246" y="-3" font-family="Inter, sans-serif" font-size="10" fill="#c3bcae"><tspan font-weight="700" fill="#f3ede0">EAP</tspan> = estenose da artéria pulmonar</text>
  </g>

  <!-- Pegadinhas siglas -->
  <text x="240" y="378" font-family="Inter, sans-serif" font-size="10" fill="#f0b440" text-anchor="middle" font-style="italic">Cuidado: PCA ≠ PCR · EAP ≠ Edema Agudo de Pulmão</text>
</svg>
