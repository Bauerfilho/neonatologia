<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="Corte axial esquemático de crânio infantil mostrando calcificação intracraniana com padrão periventricular — pontos brancos alinhados ao redor dos ventrículos laterais, desenhando o contorno ventricular. Padrão característico de citomegalovirose congênita (sinal de ouro: 'CMV calcifica meu ventrículo').">
  <rect x="0" y="0" width="240" height="200" fill="#0a1620" rx="8"/>
  <ellipse cx="120" cy="100" rx="92" ry="78" fill="#142838" stroke="#f3ede0" stroke-width="2"/>
  <line x1="120" y1="22" x2="120" y2="178" stroke="#5d5b50" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Ventrículos laterais com contorno destacado -->
  <ellipse cx="100" cy="95" rx="20" ry="30" fill="#1a3245" stroke="#6cb4e8" stroke-width="1.2" opacity="0.85"/>
  <ellipse cx="140" cy="95" rx="20" ry="30" fill="#1a3245" stroke="#6cb4e8" stroke-width="1.2" opacity="0.85"/>

  <!-- Calcificações PERIVENTRICULARES — alinhadas ao redor dos ventrículos -->
  <g fill="#f3ede0">
    <!-- Ventrículo esquerdo -->
    <circle cx="83"  cy="78"  r="2"/>
    <circle cx="85"  cy="88"  r="2.2"/>
    <circle cx="83"  cy="100" r="2"/>
    <circle cx="85"  cy="112" r="2"/>
    <circle cx="92"  cy="122" r="2.2"/>
    <circle cx="105" cy="125" r="2"/>
    <circle cx="115" cy="118" r="2.1"/>
    <circle cx="118" cy="100" r="2"/>
    <circle cx="115" cy="85"  r="2.1"/>
    <circle cx="108" cy="70"  r="2"/>
    <circle cx="95"  cy="68"  r="2.2"/>
    <!-- Ventrículo direito -->
    <circle cx="125" cy="68"  r="2"/>
    <circle cx="135" cy="65"  r="2"/>
    <circle cx="148" cy="70"  r="2.2"/>
    <circle cx="157" cy="80"  r="2"/>
    <circle cx="158" cy="92"  r="2"/>
    <circle cx="157" cy="105" r="2.1"/>
    <circle cx="155" cy="115" r="2"/>
    <circle cx="148" cy="124" r="2"/>
    <circle cx="135" cy="128" r="2.2"/>
    <circle cx="125" cy="125" r="2"/>
    <circle cx="122" cy="113" r="2"/>
  </g>
  <text x="120" y="195" font-family="Inter, sans-serif" font-size="10" fill="#6cb4e8" text-anchor="middle" font-weight="600" letter-spacing="0.5">PERIVENTRICULAR · contorna o ventrículo</text>
</svg>
